<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Listing</title>
    <link rel="stylesheet" href="css/listingpage.css" />
    <link rel="stylesheet" href="css/header-dropdown.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
    <!-- Add these before your module script -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script type="module">
      // Your existing module code
    </script>
  </head>
  <body>
    <main>
      <div class="container">
        <aside class="filter-sidebar">
          <h2 id="category-title">Products</h2>
        </aside>
        <section class="product-grid" id="product-list"></section>
      </div>
    </main>

    <script type="module">
      import { getProductsByCategory } from "./Js/helpers.js";

      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get("category") || "Men > Shoes";

      document.getElementById("category-title").textContent = category;

      getProductsByCategory(category).then((products) => {
        const list = document.getElementById("product-list");

        if (!products || Object.keys(products).length === 0) {
          list.innerHTML = "<p>No products found in this category.</p>";
          return;
        }

        list.innerHTML = "";

        Object.entries(products).forEach(([id, product]) => {
          const item = document.createElement("div");
          item.className = "product-item";

          const img =
            product.colors?.[0]?.images?.[0] ||
            "https://via.placeholder.com/300x300?text=No+Image";
          const discount =
            product.originalPrice > product.discountedPrice
              ? Math.round(
                  100 - (product.discountedPrice / product.originalPrice) * 100
                )
              : 0;

          item.innerHTML = `
          <a href="product.html?id=${id}">
            <img src="${img}" alt="${product.name}">
            <div class="product-tag">${product.tags?.[0] || ""}</div>
            <h4>${product.name}</h4>
            <p>${product.type}</p>
            <span>${product.colors?.length || 0} Colors</span>
            <p class="price">
              <span class="discount-price">${product.discountedPrice.toLocaleString()}₫</span>
              ${
                discount > 0
                  ? `
                <span class="original-price">${product.originalPrice.toLocaleString()}₫</span>
                <span class="discount-percent">${discount}% off</span>
              `
                  : ""
              }
            </p>
          </a>
        `;
          list.appendChild(item);
        });
      });
    </script>

    <script src="./Js/header+footer.js"></script>
  </body>
</html>
