<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClothingCo. Sign Up</title>
    <link rel="stylesheet" href="./css/account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
      <div class="form-container">
        <div class="brand-logo">
                <a href="index.html"><img src="/img/media/Black Beige Minimalist Simple Modern Typography Vanilla Cosmetics Logo.png"></a>
            </div>
  <div class="credential">
          <h2>Login to ClothingCo.</h2>
          <h1>Please enter your login credential</h1>
          <div class="floating-input">
  <input type="email" id="username_input_login" placeholder=" " required />
  <label for="username_input_login">E-mail</label>
  <span class="input-icon"><i class="fas fa-envelope"></i></span>
</div>
<div class="floating-input">
  <input type="password" id="password_input_login" placeholder=" " required />
  <label for="password_input_login">Password</label>
  <span class="input-icon"><i class="fas fa-lock"></i></span>
</div>


            <button type="submit" id="login_btn">Sign in</button>

            <div class="or"><span>or sign in with</span></div>


            <div class="socials">
              <button
                class="social-btn social-facebook"
                aria-label="Sign in with Facebook"
              >
                <i class="fab fa-facebook-f"></i>
              </button>
              <button
                class="social-btn social-google"
                aria-label="Sign in with Google"
              >
                <i class="fab fa-google"></i>
              </button>
              <button
                class="social-btn social-apple"
                aria-label="Sign in with Apple"
              >
                <i class="fab fa-apple"></i>
              </button>
            </div>

            <p class="sign-in">
              Don't have an account?
              <a href="register.html">Create an account</a>
            </p>
          </form>
        </div>
      </div>
        <div class="image-container">
        
                <img id="mobileapp" src="/img/media/mobileapp.png" alt="">
            
        </div>
    </div>
</body>
<script src="./Js/loginpage.js"></script>
</html>
